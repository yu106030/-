<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極選擇題</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 深色星空背景，符合遊戲氛圍 */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 玻璃擬態卡片風格 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 按鈕基礎樣式與動畫 */
        .btn-game {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn-game:active {
            transform: translateY(1px);
        }

        /* 進場動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* 隱藏元素用 */
        .hidden-step {
            display: none !important;
        }
    </style>
</head>
<body class="p-4 relative">

    <div class="absolute top-10 left-10 w-2 h-2 bg-white rounded-full opacity-50 animate-pulse"></div>
    <div class="absolute top-1/4 right-20 w-3 h-3 bg-blue-200 rounded-full opacity-30 animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute bottom-20 left-1/3 w-1.5 h-1.5 bg-yellow-200 rounded-full opacity-60 animate-pulse" style="animation-delay: 2s;"></div>

    <main id="app-container" class="glass-card rounded-3xl p-8 max-w-md w-full text-center relative z-10 fade-in">
        
        <!-- 步驟 1: 詢問是否有作業 -->
        <div id="step-1">
            <h1 class="text-3xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 drop-shadow-sm">
                今天有作業嗎？<br><span class="text-xl font-bold text-gray-300">(Homework?)</span>
            </h1>
            <div class="flex flex-col gap-4 sm:flex-row sm:justify-center">
                <button onclick="handleAnswer('yes_hw')" class="btn-game flex-1 bg-gradient-to-r from-gray-700 to-gray-600 hover:from-gray-600 hover:to-gray-500 text-white font-bold py-4 px-6 rounded-xl text-lg border-b-4 border-gray-800">
                    有 (Yes)
                </button>
                <button onclick="handleAnswer('no_hw')" class="btn-game flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 px-6 rounded-xl text-lg border-b-4 border-indigo-900">
                    沒有 (No)
                </button>
            </div>
        </div>

        <div id="step-2" class="hidden-step">
            <h1 class="text-3xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400 drop-shadow-sm">
                那你想做嗎？<br><span class="text-xl font-bold text-gray-300">(Do you want to do it?)</span>
            </h1>
            <div class="flex flex-col gap-4 sm:flex-row sm:justify-center">
                <button onclick="handleAnswer('yes_want')" class="btn-game flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold py-4 px-6 rounded-xl text-lg border-b-4 border-emerald-900">
                    想 (Yes)
                </button>
                <button onclick="handleAnswer('no_want')" class="btn-game flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 px-6 rounded-xl text-lg border-b-4 border-indigo-900">
                    不想 (No)
                </button>
            </div>
        </div>

        <div id="step-3" class="hidden-step">
            <h1 class="text-4xl font-black text-red-500 mb-6 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] animate-bounce">
                不，你不想！<br><span class="text-2xl text-white">(No you don't)</span>
            </h1>
        </div>

        <div id="step-final" class="hidden-step flex flex-col items-center justify-center">
            <!-- 佔位圖片，建議替換為實際的派蒙圖 -->
            <div class="relative w-64 h-64 rounded-2xl overflow-hidden border-4 border-gray-800 shadow-2xl transform transition-transform duration-300 hover:scale-105">
                <img src="https://img.4gamers.com.tw/news-image/d4ef6b81-7b48-4982-9d93-f65aa20d7ac5.jpg">
                    HoYoverse
                </div>
            </div>
        </div>

    </main>

    <div id="custom-alert" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl max-w-sm w-11/12 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="alert-box">
            <p id="alert-message" class="text-xl font-bold mb-6 text-white"></p>
            <button onclick="closeAlert()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2 rounded-lg font-bold transition-colors">
                確定
            </button>
        </div>
    </div>

    <script>
        // DOM 元素快取
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const stepFinal = document.getElementById('step-final');
        
        // 下載連結設定 (指向官方)
        const downloadLinks = {
            ios: 'https://apps.apple.com/app/id1517783697', // 原神 App Store
            android: 'https://play.google.com/store/apps/details?id=com.miHoYo.GenshinImpact', // 原神 Google Play
            windows: 'https://genshin.hoyoverse.com/zh-tw', // 官方 PC 啟動器頁面
            macos: 'https://apps.apple.com/app/id1517783697', // macOS (目前 M 系列晶片可跑 iPad 版，指向同一連結)
            unknown: 'https://genshin.hoyoverse.com/' // 預設導向官網首頁
        };

        // 裝置偵測變數
        let currentOS = 'unknown';

        // 初始化：偵測作業系統
        function detectOS() {
            const userAgent = window.navigator.userAgent.toLowerCase();
            
            if (/iphone|ipad|ipod/.test(userAgent)) {
                currentOS = 'ios';
            } else if (/android/.test(userAgent)) {
                currentOS = 'android';
            } else if (/macintosh|mac os x/.test(userAgent)) {
                currentOS = 'macos';
            } else if (/windows/.test(userAgent)) {
                currentOS = 'windows';
            } else {
                currentOS = 'unknown';
            }
            console.log("偵測到的作業系統:", currentOS);
        }

        // 頁面載入時執行偵測
        window.onload = detectOS;

        function handleAnswer(answer) {
            // 所有隱藏動畫
            function hideAll() {
                step1.classList.add('hidden-step');
                step2.classList.add('hidden-step');
                step3.classList.add('hidden-step');
                stepFinal.classList.add('hidden-step');
            }

            // 輔助函式：顯示特定步驟並加入動畫
            function showStep(element) {
                element.classList.remove('hidden-step');
                // 重新觸發動畫
                element.classList.remove('fade-in');
                void element.offsetWidth; // 強制重繪
                element.classList.add('fade-in');
            }

            hideAll();

            if (answer === 'no_hw') {
                // 沒有作業 -> 直接玩原神
                triggerFinalSequence();
            } 
            else if (answer === 'yes_hw') {
                // 有作業 -> 問想不想做
                showStep(step2);
            } 
            else if (answer === 'no_want') {
                // 不想做 -> 直接玩原神
                triggerFinalSequence();
            } 
            else if (answer === 'yes_want') {
                // 想做 -> 彈出「不你不想」 -> 延遲後玩原神
                showStep(step3);
                
                // 停留 1.5 秒後自動跳轉到結局
                setTimeout(() => {
                    triggerFinalSequence();
                }, 1500);
            }
        }

        function triggerFinalSequence() {
            // 隱藏其他步驟，顯示最終頁面
            step1.classList.add('hidden-step');
            step2.classList.add('hidden-step');
            step3.classList.add('hidden-step');
            
            stepFinal.classList.remove('hidden-step');
            stepFinal.classList.remove('fade-in');
            void stepFinal.offsetWidth;
            stepFinal.classList.add('fade-in');

            // 取得下載連結
            const link = downloadLinks[currentOS] || downloadLinks['unknown'];
            
            // 停留 1.5 秒讓使用者看到派蒙圖（純圖片梗），然後立刻自動跳轉
            setTimeout(() => {
                // 嘗試開啟新分頁
                const newWindow = window.open(link, '_blank');
                // 如果被瀏覽器的彈出視窗攔截器阻擋，則保底在當前視窗跳轉
                if (!newWindow) {
                    window.location.href = link;
                }
            }, 1500);
        }

        // 自訂 Alert 邏輯 (取代原生的 alert)
        const customAlert = document.getElementById('custom-alert');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');

        function showAlert(message) {
            alertMessage.innerText = message;
            customAlert.classList.remove('opacity-0', 'pointer-events-none');
            alertBox.classList.remove('scale-95');
            alertBox.classList.add('scale-100');
        }

        function closeAlert() {
            customAlert.classList.add('opacity-0', 'pointer-events-none');
            alertBox.classList.remove('scale-100');
            alertBox.classList.add('scale-95');
        }
    </script>
</body>
</html>
